[package]
name = "lamquant-lmq"
version = "0.0.2"
edition = "2021"
rust-version = "1.81"
description = "LamQuant LMQ — a current-ABIR BCS2 neural codec shell with entropy-coded FSQ tokens and a swappable backend."
license = "AGPL-3.0-or-later"
repository = "https://github.com/Quitetall/LamQuant-Lossless"
homepage = "https://github.com/Quitetall/LamQuant-Lossless"

[lib]
name = "lamquant_lmq"
crate-type = ["rlib"]

[features]
default = ["std"]
# Host build (default). The no_std firmware floor is `--no-default-features`.
std = ["lamquant-lml-mcu/std", "semantic-abir/std", "semantic-abir-bcs/std"]
# ADR 0074 N2: the PyBackend subprocess bridge (drives the Python SubbandCodec).
# Host-only — needs std (process) + a JSON protocol. NOT part of `default`, so a
# bare host build / firmware never pulls in the Python path.
python = [
    "std",
    "dep:serde",
    "dep:serde_json",
    "dep:libc",
    "dep:sha2",
    "dep:windows-sys",
]

[dependencies]
lamquant-lml-mcu = { version = "0.9.3", path = "../lamquant-lml-mcu", default-features = false }
semantic-abir = { package = "abir", version = "0.1.0", git = "https://github.com/Quitetall/ABIR.git", rev = "1891593753180ea20fe1879732be48f720700926", default-features = false, features = ["alloc"] }
semantic-abir-bcs = { package = "abir-bcs", version = "0.1.0", git = "https://github.com/Quitetall/ABIR.git", rev = "1891593753180ea20fe1879732be48f720700926", default-features = false, features = ["alloc"] }
blake3 = { version = "=1.5.5", default-features = false }
serde = { version = "1", optional = true, features = ["derive"] }
serde_json = { version = "1", optional = true, features = ["raw_value"] }
sha2 = { version = "0.10", optional = true }

[target.'cfg(unix)'.dependencies]
libc = { version = "0.2", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", optional = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }
