[workspace]
resolver = "2"
members = [
    "crates/lamquant-common",
    "crates/lamquant-model-pack",
    "crates/lamquant-neg",
    "lamquant-lml-mcu",
    "lamquant-lml-desktop",
    "lamquant-lml-optimum",
    "lamquant-lmq",
    "lamquant-lossless",
    "lamquant-py",
    # HDF5 H5Z filter cdylib (ADR 0051 Track 3). In `members` so it shares the
    # lock, but kept OUT of `default-members` below: it links system libhdf5,
    # so a bare `cargo build` must not pull it in. Build it explicitly with
    # `cargo build -p lamquant-lml-h5filter --release`.
    "lamquant-lml-h5filter",
    "crates/lamquant-abir-codec",
    "crates/lamquant-standard-adapters",
    "crates/lamquant-abir-graph",
    "crates/lamquant-abir-montage",
    "crates/lamquant-nodes",
    "crates/lamquant-plan",
]
# Firmware + weights moved to the LamQuant-Firmware submodule (ADR 0026
# phase B.1, 2026-05-30). lamquant-lsl moved to the Vision submodule
# (ADR 0026 phase B.2, 2026-05-30). lmafs moved to meta-repo
# plugins/linux/lmafs/ (OS plugin layer, 2026-06-19).
# This workspace is now host codec-only.
default-members = [
    "crates/lamquant-common",
    "crates/lamquant-neg",
    "lamquant-lml-mcu",
    "lamquant-lml-desktop",
    "lamquant-lml-optimum",
    "lamquant-lmq",
    "lamquant-lossless",
    "lamquant-py",
]
# Fuzz harness uses libfuzzer-sys + nightly toolchain; lives outside
# the host workspace so `cargo build` from root doesn't pull in nightly
# deps. Drive it explicitly via `cd lamquant-lossless && cargo +nightly fuzz`.
exclude = [
    "lamquant-lossless/fuzz",
    # BLUT is its own Cargo workspace; included via git submodule but
    # NEVER absorbed into the LamQuant workspace. Build via
    # `cd blut && cargo build`. See ADR 0017.
    "blut",
]

# Firmware-specific profiles (firmware, firmware-dev) moved to the
# LamQuant-Firmware submodule workspace (ADR 0026 phase B.1, 2026-05-30).

# `lamquant-plan` LIVES HERE, but the meta's crates reach it by a path that
# points back into this submodule (`../../codec-lossless/crates/lamquant-plan`).
# When cargo fetches `lamquant-tui`/`lamquant-ops` from the LamQuant git remote
# it clones that repo WITH submodules, so the path resolves inside the meta's
# own checkout and this workspace ends up linking two `lamquant-plan 0.1.0` --
# the local crate and the one under the meta. Two copies of one version are two
# unrelated types to rustc, which is the E0308-at-the-seam failure the
# `lamquant-plan` dependency block above exists to prevent.
#
# Patching it back to the local path is the same move the meta makes for its own
# crates, and for the same reason (ADR 0178).
[patch."https://github.com/Quitetall/LamQuant.git"]
lamquant-plan = { path = "crates/lamquant-plan" }
