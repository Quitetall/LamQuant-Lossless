[package]
name = "lamquant-standard-adapters"
version = "0.1.0"
edition = "2021"
rust-version = "1.81"
license = "AGPL-3.0-or-later"
[features]
default = ["nwb"]
nwb = ["dep:hdf5-metno", "dep:hdf5-metno-src", "lamquant-lml/nwb"]

[dependencies]
abir-adapter = { version = "0.1.0", git = "https://github.com/Quitetall/ABIR.git", rev = "e2115200e0e4f284c38aa2afd4578a204cc8f40d" }
blake3 = "=1.8.2"
# The first-class DICOM profile needs raw element access, not just the
# waveform reader the codec exposes.
dicom-core = "0.8"
# BIDS mandates gzipped continuous-recording tables.
flate2 = "1"
dicom-object = "0.8"
# Build the binding's pinned HDF5 source. Rolling distributions now ship HDF5
# 2.x, which the current binding rejects before even non-NWB adapter tests run.
# Keeping the native dependency hermetic also makes archive conformance gates
# independent of host pkg-config state. Do not loosen the source pin: 0.10.4
# bundles HDF5 2.2, which hdf5-metno-sys 0.11.3 cannot parse.
hdf5-metno = { version = "0.12", optional = true, features = ["static"] }
hdf5-metno-src = { version = "=0.10.0", optional = true }
lamquant-lml = { version = "0.9.3", path = "../../lamquant-lossless", default-features = false, features = ["archive", "dicom"] }
semantic-abir = { package = "abir", version = "0.1.0", git = "https://github.com/Quitetall/ABIR.git", rev = "e2115200e0e4f284c38aa2afd4578a204cc8f40d" }
serde_json = "1"
tempfile = "3"

[dev-dependencies]
lamquant-common = { version = "0.1.3", path = "../lamquant-common" }

[[example]]
name = "nwb_semantic_probe"
required-features = ["nwb"]

[[test]]
name = "nwb_semantic_adapter"
required-features = ["nwb"]
