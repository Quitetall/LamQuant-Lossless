[package]
name = "lamquant-abir-codec"
version = "0.1.0"
edition = "2021"
rust-version = "1.81"
# Matches LICENSE.md and every sibling first-party crate. Package 39 publishes
# this semantic codec seam because the public `lamquant-lml` crate depends on
# it; leaving it repository-only makes that public dependency graph unusable.
license = "AGPL-3.0-or-later"
build = "build.rs"

[features]
default = ["std"]
# Seal and open optimum-coded bundles. Off by default: a consumer that only
# ever handles baseline LML should not link a second decoder, and firmware does
# not depend on this crate at all.
optimum = ["dep:lamquant-lml-optimum"]
optimum-v2 = ["std", "dep:lamquant-lml-optimum-v2"]
experimental-arithmetic = ["std", "lamquant-lml-mcu/experimental_arithmetic"]

std = [
    "semantic-abir/std",
    "semantic-abir-bcs/std",
    "lamquant-abir-montage/std",
    "lamquant-lml-mcu/std",
    "dep:lamquant-lml-desktop",
]

[dependencies]
semantic-abir = { package = "abir", version = "0.1.0", git = "https://github.com/Quitetall/ABIR.git", rev = "67470c770a1e74d7a6f2a1f6cda96f292f52798e", default-features = false, features = ["alloc"] }
semantic-abir-bcs = { package = "abir-bcs", version = "0.1.0", git = "https://github.com/Quitetall/ABIR.git", rev = "67470c770a1e74d7a6f2a1f6cda96f292f52798e", default-features = false, features = ["alloc"] }
blake3 = { version = "=1.8.2", default-features = false }
lamquant-lml-mcu = { version = "0.9.3", path = "../../lamquant-lml-mcu", default-features = false }
lamquant-lml-desktop = { version = "0.9.3", path = "../../lamquant-lml-desktop", optional = true }
lamquant-abir-montage = { version = "0.1.0", path = "../lamquant-abir-montage", default-features = false }
# The Optimum (LMO) decoder, needed only to run the closure proof over
# optimum-coded packets before sealing them. Optional and `decode`-only: that
# feature is no_std-capable, so enabling it does not drag std into this crate.
lamquant-lml-optimum = { version = "0.0.1", path = "../../lamquant-lml-optimum", default-features = false, features = ["decode"], optional = true }
lamquant-lml-optimum-v2 = { version = "0.1.0", path = "../../lamquant-lml-optimum-v2", features = ["parallel"], optional = true }

[build-dependencies]
blake3 = { version = "=1.8.2" }

[dev-dependencies]
# Tests exercise the real transform-2 encoder. Production consumers still pull
# only the no_std-capable decoder through the optional dependency above.
lamquant-lml-optimum = { version = "0.0.1", path = "../../lamquant-lml-optimum", default-features = false, features = ["encode"] }
sha2 = { version = "0.10", default-features = false }
