[package]
name = "lamquant-abir-montage"
version = "0.1.0"
edition = "2021"
rust-version = "1.81"
license = "AGPL-3.0-or-later"
# Internal crate. Wildcard path dependencies cannot be published to crates.io,
# so the missing flag made cargo-deny treat it as publishable and reject those
# deps instead of applying allow-wildcard-paths.
publish = false
description = "Exact no_std projection of LamQuant electrode montages into ABIR."

[lib]
name = "lamquant_abir_montage"

[features]
default = ["std"]
std = ["semantic-abir/std"]

[dependencies]
semantic-abir = { package = "abir", git = "https://github.com/Quitetall/ABIR.git", rev = "92cae253f0a43b0c457cb1c0b773d77420f288a7", default-features = false, features = ["alloc"] }
sha2 = { version = "0.10", default-features = false }
