[package]
name = "lamquant-abir-montage"
version = "0.1.0"
edition = "2021"
rust-version = "1.81"
license = "AGPL-3.0-or-later"
# Public semantic dependency of the Package 39 LamQuant crate family.
description = "Exact no_std projection of LamQuant electrode montages into ABIR."

[lib]
name = "lamquant_abir_montage"

[features]
default = ["std"]
std = ["semantic-abir/std"]

[dependencies]
semantic-abir = { package = "abir", version = "0.1.0", git = "https://github.com/Quitetall/ABIR.git", rev = "7e5700e9ef4e5c7c6a42d829196cd2d0a642f647", default-features = false, features = ["alloc"] }
sha2 = { version = "0.10", default-features = false }
