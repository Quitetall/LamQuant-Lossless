[package]
name = "lamquant-abir-montage"
version = "0.1.0"
edition = "2021"
rust-version = "1.81"
license = "AGPL-3.0-or-later"
description = "Exact no_std projection of LamQuant electrode montages into ABIR."

[lib]
name = "lamquant_abir_montage"

[features]
default = ["std"]
std = ["semantic-abir/std"]

[dependencies]
semantic-abir = { package = "abir", git = "https://github.com/Quitetall/ABIR.git", rev = "4083198d644fb8bcb98df71cd830bf46a59fca45", default-features = false, features = ["alloc"] }
sha2 = { version = "0.10", default-features = false }
