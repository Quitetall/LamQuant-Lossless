[package]
name = "lamquant-abir-graph"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "Conformance projection between ABIR's semantic atoms and blut-graph-core's node-graph type mirror."

# Placed in codec-lossless rather than the meta-repo root on purpose: firmware is
# a separate repository, cannot path-depend into the root tree, and already
# git-pins codec-lossless. Anywhere else would add a fourth cross-repo revision
# to keep coherent.
#
# `no_std + alloc` for the same reason -- firmware must be able to consume it.

[lib]
name = "lamquant_abir_graph"

[features]
default = ["std"]
std = ["semantic-abir/std", "blut-graph-core/std", "lamquant-abir-montage/std"]

[dependencies]
# ADR 0139 contract 4: blut-graph-core models ABIR by string convention and takes
# NO ABIR dependency. That independence is correct and this crate preserves it --
# the projection lives HERE, on the LamQuant side, depending on both.
semantic-abir = { package = "abir", version = "0.1.0", git = "https://github.com/Quitetall/ABIR.git", rev = "a8f0251891c07570e373230a8fed89264147e096", default-features = false, features = ["alloc"] }
blut-graph-core = { version = "=0.1.0-alpha.1", git = "https://github.com/Quitetall/blut.git", rev = "c2464ae63c1cfbb282e207393a81ec2921e6be69", default-features = false }
lamquant-abir-montage = { version = "0.1.0", path = "../lamquant-abir-montage", default-features = false }

[dev-dependencies]
# Only the tests serialise; the projection itself never touches JSON.
serde_json = "1"
