[package]
name = "lamquant-nodes"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "AGPL-3.0-or-later"
description = "Production ABIR Node catalog and fused LamQuant kernel adapters."
build = "build.rs"

[[bin]]
name = "lmq-package16-verify"
path = "src/bin/lmq_package16_verify.rs"
required-features = ["lmq"]

[features]
default = ["std"]
std = [
    "blut-graph-core/std",
    "lamquant-abir-codec/std",
    "lamquant-lml-mcu/std",
    "semantic-abir/std",
    "semantic-abir-bcs/std",
]
experimental-arithmetic = [
    "std",
    "lamquant-abir-codec/experimental-arithmetic",
    "lamquant-lml-mcu/experimental_arithmetic",
]
lmq = [
    "std",
    "dep:ed25519-dalek",
    "dep:fs2",
    "dep:libc",
    "dep:lamquant-lmq",
    "dep:rustix",
    "dep:serde",
    "dep:serde_json",
]
lmq-python = [
    "lmq",
    "lamquant-lmq/python",
]
standard-adapters = [
    "std",
    "dep:abir-adapter",
    "dep:lamquant-standard-adapters",
]
standard-nwb = [
    "standard-adapters",
    "lamquant-standard-adapters/nwb",
]

[dependencies]
abir-adapter = { version = "0.1.0", git = "https://github.com/Quitetall/ABIR.git", rev = "4eec3689abd67b2e9bc1117ea246a1fbb919e4b0", optional = true }
blake3 = { version = "=1.5.5", default-features = false }
blut-graph-core = { version = "=0.1.0-alpha.1", git = "https://github.com/Quitetall/blut.git", rev = "879368d3fc7f6185eac562b52e7dde2228f013e6", default-features = false }
ed25519-dalek = { version = "2.1", optional = true }
fs2 = { version = "0.4.3", optional = true }
lamquant-abir-codec = { version = "0.1.0", path = "../lamquant-abir-codec", default-features = false }
lamquant-lmq = { version = "0.0.2", path = "../../lamquant-lmq", default-features = false, optional = true }
lamquant-lml-mcu = { version = "0.9.3", path = "../../lamquant-lml-mcu", default-features = false }
lamquant-standard-adapters = { version = "0.1.0", path = "../lamquant-standard-adapters", default-features = false, optional = true }
semantic-abir = { package = "abir", version = "0.1.0", git = "https://github.com/Quitetall/ABIR.git", rev = "4eec3689abd67b2e9bc1117ea246a1fbb919e4b0", default-features = false, features = ["alloc"] }
semantic-abir-bcs = { package = "abir-bcs", version = "0.1.0", git = "https://github.com/Quitetall/ABIR.git", rev = "4eec3689abd67b2e9bc1117ea246a1fbb919e4b0", default-features = false, features = ["alloc"] }
serde = { version = "1", default-features = false, features = ["alloc"], optional = true }
serde_json = { version = "1", features = ["arbitrary_precision"], optional = true }

[target.'cfg(unix)'.dependencies]
libc = { version = "0.2", optional = true }
rustix = { version = "1", features = ["process"], optional = true }

[build-dependencies]
blake3 = { version = "=1.5.5" }

[dev-dependencies]
flate2 = "1"
