[package]
name = "lamquant-nodes"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "AGPL-3.0-or-later"
description = "Production ABIR Node catalog and fused LamQuant kernel adapters."
publish = false
build = "build.rs"

[features]
default = ["std"]
std = [
    "blut-graph-core/std",
    "lamquant-abir-codec/std",
    "lamquant-lml-mcu/std",
    "semantic-abir/std",
    "semantic-abir-bcs/std",
]
experimental-arithmetic = [
    "std",
    "lamquant-abir-codec/experimental-arithmetic",
    "lamquant-lml-mcu/experimental_arithmetic",
]
optimum-v2 = [
    "std",
    "lamquant-abir-codec/optimum-v2",
    "dep:lamquant-lml-optimum-v2",
]
standard-adapters = [
    "std",
    "dep:abir-adapter",
    "dep:lamquant-standard-adapters",
]
standard-nwb = [
    "standard-adapters",
    "lamquant-standard-adapters/nwb",
]

[dependencies]
abir-adapter = { git = "https://github.com/Quitetall/ABIR.git", rev = "3f5c47cb76d0707f4443c001a4e1c37d19ccb2da", optional = true }
blake3 = { version = "=1.5.5", default-features = false }
blut-graph-core = { git = "https://github.com/Quitetall/blut.git", rev = "aeef7fe9d6a6f7cd8dd2ab818578bd014dcd6d69", default-features = false }
lamquant-abir-codec = { version = "0.1.0", path = "../lamquant-abir-codec", default-features = false }
lamquant-lml-mcu = { version = "0.9.3", path = "../../lamquant-lml-mcu", default-features = false }
lamquant-lml-optimum-v2 = { version = "0.1.0", path = "../../lamquant-lml-optimum-v2", optional = true }
lamquant-standard-adapters = { version = "0.1.0", path = "../lamquant-standard-adapters", default-features = false, optional = true }
semantic-abir = { package = "abir", git = "https://github.com/Quitetall/ABIR.git", rev = "3f5c47cb76d0707f4443c001a4e1c37d19ccb2da", default-features = false, features = ["alloc"] }
semantic-abir-bcs = { package = "abir-bcs", git = "https://github.com/Quitetall/ABIR.git", rev = "3f5c47cb76d0707f4443c001a4e1c37d19ccb2da", default-features = false, features = ["alloc"] }

[build-dependencies]
blake3 = { version = "=1.5.5" }

[dev-dependencies]
criterion = { version = "0.5", features = ["cargo_bench_support"] }
flate2 = "1"

[[bench]]
name = "node_vs_direct"
harness = false
