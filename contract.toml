# Test obligations this repository satisfies, and how.
#
# The meta-repository declares WHAT must be true (tests/contracts/test-taxonomy.toml,
# `obligations` per owner). This file declares HOW this repository proves it. The
# validator (`tools/owner_contracts.py`) runs these commands here and observes the
# result; it never learns this repository's test layout, so reorganising tests is
# a local change that breaks nothing upstream.
#
# ADR 0092 invariant 5: owner-local tests exercise implementation; the meta
# exercises public interfaces. This file is the seam between those two.

schema_version = 1
owner = "lossless"

[obligation.owner-tests]
description = """
The Python suite. Covers the codec, container, EDF reader, decoder, firmware
export toolchain, and integration lanes.
"""
argv = ["python3", "-m", "pytest", "-q"]
timeout_seconds = 1200

# RATCHET, not a waiver. Measured 2026-08-10: 20 failed, 192 passed, 36 skipped,
# 24 errors -> 44 failing. The validator refuses any number ABOVE this, so the
# debt can only shrink; lowering it is a normal commit, raising it needs a reason
# in review.
#
# Set to the measured truth rather than 0 on purpose. A ceiling of 0 here would
# make this gate red on arrival across every owner, and a gate that is red on
# arrival gets ignored — which is how the 75 root collection errors survived a
# month behind "the failures are pre-existing".
#
# Known contents of the 44, so the number is not a mystery to whoever lowers it:
#   * tests/test_repair_lma_prune.py — FileNotFoundError on a fixture path
#   * tests/firmware/test_l3_export.py + test_l5_firmware_parity.py — 4 failures
#     + 4 fixture errors, surfaced (not caused) when collection was repaired in
#     `5a062a8`; they had been invisible because collection aborted first
max_failures = 44
